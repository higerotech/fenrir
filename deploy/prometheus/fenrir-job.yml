# Job de scrape del NVR — ADR-0008.
#
# Este fichero es la ESPECIFICACIÓN; se instala en el proyecto que gobierna Prometheus
# (su `prometheus.yml`), no en este repositorio. Vive aquí para que la observabilidad del
# NVR esté versionada junto al NVR aunque se ejecute en otro sitio.
#
# El objetivo es el puerto 5000, que no está publicado: Prometheus lo alcanza por la red
# Docker compartida. Ese es justamente el motivo por el que T6 sigue intacto.
#
# El nombre sigue la convención nórdica del host (`mimir`, `gjallarhorn`, `huginn_muninn`,
# `sleipnir`): el job se llama como el servicio, `fenrir`. El objetivo es el nombre de
# servicio del compose, no el del contenedor — igual que `gjallarhorn:9093`.
- job_name: fenrir
  scrape_interval: 30s
  metrics_path: /api/metrics
  static_configs:
    - targets: ["fenrir:5000"]
