# Fenrir — NVR doméstico sobre Frigate. ADR-0003: imagen pineada, secretos en .env, puertos mínimos
name: fenrir

# T5 — Docker publica vía DNAT en PREROUTING y NO atraviesa la cadena `input` de nftables:
# un default-drop en input NO protege un puerto publicado. Por eso el bind es explícito a
# ${FRIGATE_LAN_IP} en lugar de 0.0.0.0. Las reglas de DOCKER-USER (runbook §8) quedan como
# segunda barrera, no como única.
x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: "10m"        # T1 — json-file no rota por defecto: logs ilimitados llenan el HDD
      max-file: "3"

services:
  fenrir:
    image: ghcr.io/blakeblackshear/frigate:0.17.2   # NO usar stable/latest (ADR-0003)
    container_name: fenrir-frigate
    restart: unless-stopped
    stop_grace_period: 30s
    # RNF03 — el limite debe cubrir tmpfs (954 MiB) + shm (128 MiB) + procesos: en cgroup v2
    # esas paginas se cargan al contenedor. Sin limite, el OOM killer del kernel elige
    # victima por heuristica y puede llevarse dnsmasq (DNS/DHCP de la casa) en vez de Frigate.
    mem_limit: 3g
    shm_size: "128mb"                # 53,7 MB necesarios a 640x360 x2 + logs; holgura x2,4
    <<: *logging
    devices:
      - /dev/dri/renderD128:/dev/dri/renderD128   # VAAPI (Intel HD 2500)
    # Mapear el dispositivo NO da pertenencia al grupo dentro del contenedor: renderD128 es
    # root:render y sin esto ffmpeg falla con permission denied y Frigate cae a decodificar
    # por CPU sin decirlo claramente. El GID es del host: `getent group render`.
    group_add:
      - "${RENDER_GID}"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /srv/fenrir/config:/config
      - /srv/fenrir/media:/media/frigate
      - type: tmpfs                  # caché de segmentos en RAM, protege el HDD
        target: /tmp/cache
        tmpfs:
          size: 1000000000
    ports:
      - "${FRIGATE_LAN_IP}:8971:8971"        # UI + API autenticada
      - "${FRIGATE_LAN_IP}:8554:8554"        # go2rtc restream RTSP
      - "${FRIGATE_LAN_IP}:8555:8555/tcp"    # WebRTC
      - "${FRIGATE_LAN_IP}:8555:8555/udp"
      # Puerto 5000 (API sin auth) deliberadamente NO publicado (T6). Prometheus lo alcanza
      # por la red `iot`, que es justo el motivo de no tener que publicarlo.
    # Toda variable {FRIGATE_*} que use config.yml TIENE que aparecer aqui: Frigate solo
    # sustituye las que ve en su entorno, y si falta una aborta con KeyError al arrancar.
    #   comprobar: grep -oE '\{FRIGATE_[A-Z0-9_]+\}' frigate/config.yml | sort -u
    environment:
      LIBVA_DRIVER_NAME: i965        # driver correcto para Ivy Bridge (2.ª-6.ª gen)
      FRIGATE_RTSP_USER: ${FRIGATE_RTSP_USER}
      FRIGATE_RTSP_PASSWORD: ${FRIGATE_RTSP_PASSWORD}
      FRIGATE_MQTT_HOST: ${FRIGATE_MQTT_HOST}    # broker existente del host (ADR-0008)
      FRIGATE_MQTT_USER: ${FRIGATE_MQTT_USER}
      FRIGATE_MQTT_PASSWORD: ${FRIGATE_MQTT_PASSWORD}
      FRIGATE_LAN_IP: ${FRIGATE_LAN_IP}      # usado por go2rtc.webrtc.candidates (RF04)
      FRIGATE_CAM1_IP: ${FRIGATE_CAM1_IP}    # las IPs reales viven solo en .env (repo publico)
      FRIGATE_CAM2_IP: ${FRIGATE_CAM2_IP}
    networks:
      - iot

# ADR-0008: el NVR no trae broker propio. Se une a la red del stack ya desplegado en el
# host, donde viven el broker MQTT, Node-RED, Prometheus y Alertmanager. Consecuencias:
#   - No hay colisión en 1883: ese puerto ya lo sirve el broker existente.
#   - Ni 1883 ni 5000 se publican en ningún sitio. Prometheus raspa `fenrir:5000` por la
#     red interna, así que T6 queda intacto en vez de mitigado a medias.
networks:
  iot:
    external: true
    name: ${IOT_NETWORK}
